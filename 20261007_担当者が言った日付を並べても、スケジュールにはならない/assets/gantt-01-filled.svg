<svg xmlns="http://www.w3.org/2000/svg" width="960" height="420" viewBox="0 0 960 420">
  <rect width="960" height="420" fill="#f7f6f3"/>
  <!-- grid / axis -->
  <line x1="140" y1="48" x2="140" y2="380" stroke="#3a3a3a" stroke-width="2"/>
  <line x1="140" y1="48" x2="900" y2="48" stroke="#3a3a3a" stroke-width="2"/>
  <!-- week ticks -->
  <g fill="#6b6b6b" font-family="system-ui,sans-serif" font-size="14">
    <text x="170" y="36">8/1</text>
    <text x="290" y="36">8/8</text>
    <text x="410" y="36">8/15</text>
    <text x="530" y="36">8/22</text>
    <text x="650" y="36">8/29</text>
    <text x="770" y="36">9/5</text>
  </g>
  <g stroke="#d0cec8" stroke-width="1">
    <line x1="190" y1="48" x2="190" y2="380"/><line x1="310" y1="48" x2="310" y2="380"/>
    <line x1="430" y1="48" x2="430" y2="380"/><line x1="550" y1="48" x2="550" y2="380"/>
    <line x1="670" y1="48" x2="670" y2="380"/><line x1="790" y1="48" x2="790" y2="380"/>
  </g>
  <!-- row labels -->
  <g fill="#3a3a3a" font-family="system-ui,sans-serif" font-size="16" text-anchor="end">
    <text x="128" y="102">Task A</text>
    <text x="128" y="172">Task B</text>
    <text x="128" y="242">Task C</text>
    <text x="128" y="312">Task D</text>
  </g>
  <!-- bars neatly filled to deadlines -->
  <rect x="160" y="78" width="280" height="36" rx="4" fill="#5a6a7a" opacity="0.85"/>
  <rect x="200" y="148" width="360" height="36" rx="4" fill="#4a5a6a" opacity="0.85"/>
  <rect x="280" y="218" width="320" height="36" rx="4" fill="#5a6a7a" opacity="0.85"/>
  <rect x="340" y="288" width="300" height="36" rx="4" fill="#4a5a6a" opacity="0.85"/>
  <!-- date end markers -->
  <g fill="#3a3a3a" font-family="system-ui,sans-serif" font-size="13" font-weight="600">
    <text x="448" y="102">8/18</text>
    <text x="568" y="172">8/28</text>
    <text x="608" y="242">9/2</text>
    <text x="648" y="312">9/4</text>
  </g>
</svg>
