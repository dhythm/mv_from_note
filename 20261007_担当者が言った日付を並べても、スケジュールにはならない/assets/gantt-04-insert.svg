<svg xmlns="http://www.w3.org/2000/svg" width="960" height="520" viewBox="0 0 960 520">
  <rect width="960" height="520" fill="#f7f6f3"/>
  <line x1="140" y1="48" x2="140" y2="480" stroke="#3a3a3a" stroke-width="2"/>
  <line x1="140" y1="48" x2="900" y2="48" stroke="#3a3a3a" stroke-width="2"/>
  <g fill="#6b6b6b" font-family="system-ui,sans-serif" font-size="14">
    <text x="170" y="36">8/1</text>
    <text x="290" y="36">8/8</text>
    <text x="410" y="36">8/15</text>
    <text x="530" y="36">8/22</text>
    <text x="650" y="36">8/29</text>
    <text x="770" y="36">9/5</text>
  </g>
  <g stroke="#d0cec8" stroke-width="1">
    <line x1="190" y1="48" x2="190" y2="480"/><line x1="310" y1="48" x2="310" y2="480"/>
    <line x1="430" y1="48" x2="430" y2="480"/><line x1="550" y1="48" x2="550" y2="480"/>
    <line x1="670" y1="48" x2="670" y2="480"/><line x1="790" y1="48" x2="790" y2="480"/>
  </g>
  <g fill="#3a3a3a" font-family="system-ui,sans-serif" font-size="15" text-anchor="end">
    <text x="128" y="98">Task A</text>
    <text x="128" y="158">Task B·前</text>
    <text x="128" y="218">追加</text>
    <text x="128" y="278">Task B·残</text>
    <text x="128" y="338">Task C</text>
    <text x="128" y="398">Task D</text>
  </g>
  <!-- Task A unchanged -->
  <rect x="160" y="74" width="280" height="32" rx="4" fill="#5a6a7a" opacity="0.75"/>
  <!-- Task B done portion (70%) — closed off -->
  <rect x="200" y="134" width="252" height="32" rx="4" fill="#3a5a4a" opacity="0.95"/>
  <text x="220" y="156" fill="#f7f6f3" font-family="system-ui,sans-serif" font-size="12" font-weight="600">区切り</text>
  <!-- Added task row -->
  <rect x="160" y="194" width="200" height="32" rx="4" fill="#8a5a4a" opacity="0.95"/>
  <text x="175" y="216" fill="#f7f6f3" font-family="system-ui,sans-serif" font-size="12">追加タスク</text>
  <!-- Remaining 30% inserted AFTER added task -->
  <rect x="380" y="254" width="160" height="32" rx="4" fill="#7a8a6a" opacity="0.95"/>
  <text x="395" y="276" fill="#f7f6f3" font-family="system-ui,sans-serif" font-size="12">残り作業</text>
  <!-- insert arrow from crack position to new row -->
  <path d="M460 170 C500 190, 420 230, 450 254" stroke="#c45c3a" stroke-width="2.5" fill="none" stroke-dasharray="5 4"/>
  <polygon points="450,254 442,246 458,246" fill="#c45c3a"/>
  <!-- Task C, D -->
  <rect x="280" y="314" width="320" height="32" rx="4" fill="#5a6a7a" opacity="0.75"/>
  <rect x="340" y="374" width="300" height="32" rx="4" fill="#4a5a6a" opacity="0.75"/>
  <text x="160" y="450" fill="#3a3a3a" font-family="system-ui,sans-serif" font-size="13">外枠は延びても、中身を見れば追加に時間を使ったとわかる</text>
  <text x="160" y="472" fill="#6b6b6b" font-family="system-ui,sans-serif" font-size="11">※7割／3割は演出上の割合。厳密な計測ではない</text>
</svg>
