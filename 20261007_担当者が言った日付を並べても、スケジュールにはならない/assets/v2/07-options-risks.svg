<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720"><g font-family="Hiragino Sans,Noto Sans JP,sans-serif"><rect id="background" x="0" y="0" width="1280" height="720" rx="8" fill="#f7f6f3" opacity="1"/><text id="headline" x="64" y="103" font-size="44" font-weight="600" fill="#3a3a3a">案とリスクをそろえる。</text><text id="subheadline" x="64" y="151" font-size="24" font-weight="400" fill="#3a3a3a">具体的な短縮効果・人数・費用・承認結果は付け足さない。</text><path id="shared-deadline" d="M640 235 L640 540" fill="none" stroke="#c45c3a" stroke-width="3" stroke-dasharray="10 8"/><text id="deadline-title" x="565" y="215" font-size="25" font-weight="600" fill="#c45c3a">期限を基準に</text><g id="plan-a"><rect id="plan-a-panel" x="80" y="270" width="500" height="225" rx="8" fill="#d0cec8" opacity="0.35"/><text id="plan-a-title" x="108" y="322" font-size="34" font-weight="600" fill="#3a3a3a">期限内に終える案</text><text id="plan-a-risk" x="108" y="385" font-size="29" font-weight="600" fill="#3a3a3a">課題・リスクを示す</text><text id="plan-a-feasibility" x="108" y="448" font-size="27" font-weight="600" fill="#3a3a3a">実行できる手札を確認</text></g><g id="plan-b"><rect id="plan-b-panel" x="700" y="270" width="500" height="225" rx="8" fill="#d0cec8" opacity="0.35"/><text id="plan-b-title" x="728" y="322" font-size="34" font-weight="600" fill="#3a3a3a">代わりの案</text><text id="plan-b-risk" x="728" y="385" font-size="29" font-weight="600" fill="#3a3a3a">課題・リスクを示す</text><text id="plan-b-feasibility" x="728" y="448" font-size="27" font-weight="600" fill="#3a3a3a">実行できる手札を確認</text></g><text id="staff-check" x="80" y="548" font-size="27" font-weight="600" fill="#3a3a3a">人を増やすなら、先に社内でアサイン可否を確認。</text><text id="decision-request" x="300" y="598" font-size="40" font-weight="600" fill="#3a3a3a">関係者に、判断を求める。</text><text id="footer" x="64" y="660" font-size="23" font-weight="400" fill="#3a3a3a">この図は判断の構造。承認済みの記号や架空の効果を出さない。</text></g></svg>
