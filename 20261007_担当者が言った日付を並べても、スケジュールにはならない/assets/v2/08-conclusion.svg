<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720"><g font-family="Hiragino Sans,Noto Sans JP,sans-serif"><rect id="background" x="0" y="0" width="1280" height="720" rx="8" fill="#f7f6f3" opacity="1"/><text id="headline" x="64" y="103" font-size="44" font-weight="600" fill="#3a3a3a">成功したら、PMのおかげでもある。</text><text id="subheadline" x="64" y="151" font-size="24" font-weight="400" fill="#3a3a3a">文字とバーの構図を再編しながら、結びへ。</text><g id="starting-point"><text id="starting-title" x="80" y="285" font-size="36" font-weight="600" fill="#3a3a3a">日付の集合</text><rect id="old-a" x="80" y="323" width="250" height="38" rx="8" fill="#4a5a6a" opacity="0.45"/><rect id="old-b" x="150" y="379" width="250" height="38" rx="8" fill="#4a5a6a" opacity="0.45"/><text id="starting-caption" x="80" y="475" font-size="34" font-weight="600" fill="#3a3a3a">スタート地点</text></g><g id="read-risk"><text id="risk-title" x="655" y="285" font-size="38" font-weight="600" fill="#3a3a3a">リスクを読む</text><rect id="final-completed" x="650" y="325" width="130" height="38" rx="8" fill="#3a5a4a" opacity="1"/><rect id="final-extra" x="790" y="381" width="110" height="38" rx="8" fill="#8a5a4a" opacity="1"/><rect id="final-remaining" x="910" y="437" width="150" height="38" rx="8" fill="#4a5a6a" opacity="1"/><text id="replan-title" x="655" y="522" font-size="33" font-weight="600" fill="#3a3a3a">組み替え、判断を求める</text></g><text id="conclusion" x="200" y="599" font-size="44" font-weight="600" fill="#3a3a3a">初めて、スケジュールになる。</text><text id="footer" x="64" y="660" font-size="23" font-weight="400" fill="#3a3a3a">日付の裏のリスクを読み、成功する形に組み替える。</text></g></svg>
