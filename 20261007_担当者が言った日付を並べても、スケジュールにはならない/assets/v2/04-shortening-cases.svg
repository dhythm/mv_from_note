<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720"><g font-family="Hiragino Sans,Noto Sans JP,sans-serif"><rect id="background" x="0" y="0" width="1280" height="720" rx="8" fill="#f7f6f3" opacity="1"/><text id="headline" x="64" y="103" font-size="44" font-weight="600" fill="#3a3a3a">同じ2週間でも、中身が違う。</text><text id="subheadline" x="64" y="151" font-size="24" font-weight="400" fill="#3a3a3a">説明用の対比。具体工程や短縮効果の実例ではない。</text><text id="grounded-title" x="80" y="270" font-size="30" font-weight="600" fill="#3a3a3a">理由がわかる短縮</text><g id="grounded"><rect id="grounded-work" x="80" y="300" width="210" height="66" rx="8" fill="#3a5a4a" opacity="1"/><rect id="grounded-verification" x="300" y="300" width="210" height="66" rx="8" fill="#3a5a4a" opacity="1"/><text id="grounded-work-label" x="143" y="344" font-size="28" font-weight="600" fill="#f7f6f3">作業</text><text id="grounded-verification-label" x="350" y="344" font-size="28" font-weight="600" fill="#f7f6f3">検証</text><text id="grounded-duration" x="600" y="344" font-size="42" font-weight="600" fill="#3a3a3a">4週 → 2週</text><text id="grounded-result" x="920" y="343" font-size="36" font-weight="600" fill="#3a5a4a">問題ない</text></g><text id="risky-title" x="80" y="445" font-size="30" font-weight="600" fill="#3a3a3a">検証を削る短縮</text><g id="risky"><rect id="risky-work" x="80" y="475" width="210" height="66" rx="8" fill="#4a5a6a" opacity="1"/><rect id="risky-verification" x="300" y="475" width="210" height="66" rx="8" fill="#c45c3a" opacity="0.3"/><text id="risky-work-label" x="143" y="519" font-size="28" font-weight="600" fill="#f7f6f3">作業</text><text id="risky-verification-label" x="350" y="519" font-size="28" font-weight="600" fill="#3a3a3a">検証減</text><text id="risky-duration" x="600" y="519" font-size="42" font-weight="600" fill="#3a3a3a">4週 → 2週</text><text id="risky-result" x="920" y="518" font-size="36" font-weight="600" fill="#c45c3a">リスク</text></g><text id="footer" x="64" y="660" font-size="23" font-weight="400" fill="#3a3a3a">工程・余白・検証を順に見せ、最後に二例を比較する。</text></g></svg>
