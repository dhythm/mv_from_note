<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720"><g font-family="Hiragino Sans,Noto Sans JP,sans-serif"><rect id="background" x="0" y="0" width="1280" height="720" rx="8" fill="#f7f6f3" opacity="1"/><text id="headline" x="64" y="103" font-size="44" font-weight="600" fill="#3a3a3a">遅れたら、何が起きる？</text><text id="subheadline" x="64" y="151" font-size="24" font-weight="400" fill="#3a3a3a">リスクを聞いてから、日付と余白を考える。</text><g id="dependency-chain"><rect id="upstream" x="90" y="300" width="260" height="80" rx="8" fill="#4a5a6a" opacity="1"/><text id="upstream-text" x="120" y="351" font-size="32" font-weight="600" fill="#f7f6f3">受け渡し</text><path id="dependency-one" d="M350 340 L490 340" fill="none" stroke="#c45c3a" stroke-width="3"/><rect id="next" x="490" y="300" width="260" height="80" rx="8" fill="#4a5a6a" opacity="1"/><text id="next-text" x="540" y="351" font-size="32" font-weight="600" fill="#f7f6f3">後工程</text><path id="dependency-two" d="M750 340 L890 340" fill="none" stroke="#c45c3a" stroke-width="3"/><rect id="final" x="890" y="300" width="260" height="80" rx="8" fill="#4a5a6a" opacity="1"/><text id="final-text" x="940" y="351" font-size="32" font-weight="600" fill="#f7f6f3">完了</text></g><g id="acceptable"><text id="acceptable-label" x="90" y="457" font-size="31" font-weight="600" fill="#3a5a4a">許容できる → 日付はそのまま</text></g><g id="buffer"><text id="buffer-label" x="90" y="523" font-size="31" font-weight="600" fill="#3a3a3a">後ろも遅れる → バッファを検討</text><rect id="buffer-space" x="740" y="474" width="120" height="66" rx="8" fill="#c45c3a" opacity="0.15"/><text id="buffer-caption" x="757" y="517" font-size="26" font-weight="600" fill="#c45c3a">余白</text></g><text id="footer" x="64" y="660" font-size="23" font-weight="400" fill="#3a3a3a">品質が下がるほど前倒しするなら、本人と相談する。</text></g></svg>
