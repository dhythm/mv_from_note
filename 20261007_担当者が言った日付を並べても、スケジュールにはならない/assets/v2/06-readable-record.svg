<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720"><g font-family="Hiragino Sans,Noto Sans JP,sans-serif"><rect id="background" x="0" y="0" width="1280" height="720" rx="8" fill="#f7f6f3" opacity="1"/><text id="headline" x="64" y="103" font-size="44" font-weight="600" fill="#3a3a3a">記録は読める。でも、期限は？</text><text id="subheadline" x="64" y="151" font-size="24" font-weight="400" fill="#3a3a3a">完了 → 追加 → 残作業。期限の問題は残っている。</text><g id="schedule"><g id="timeline"><path id="axis" d="M240 215 L1140 215" fill="none" stroke="#d0cec8" stroke-width="3"/><path id="grid-0" d="M240 215 L240 575" fill="none" stroke="#d0cec8" stroke-width="3"/><text id="time-0" x="232" y="200" font-size="18" font-weight="400" fill="#3a3a3a">0</text><path id="grid-1" d="M326 215 L326 575" fill="none" stroke="#d0cec8" stroke-width="3"/><text id="time-1" x="318" y="200" font-size="18" font-weight="400" fill="#3a3a3a">1</text><path id="grid-2" d="M412 215 L412 575" fill="none" stroke="#d0cec8" stroke-width="3"/><text id="time-2" x="404" y="200" font-size="18" font-weight="400" fill="#3a3a3a">2</text><path id="grid-3" d="M498 215 L498 575" fill="none" stroke="#d0cec8" stroke-width="3"/><text id="time-3" x="490" y="200" font-size="18" font-weight="400" fill="#3a3a3a">3</text><path id="grid-4" d="M584 215 L584 575" fill="none" stroke="#d0cec8" stroke-width="3"/><text id="time-4" x="576" y="200" font-size="18" font-weight="400" fill="#3a3a3a">4</text><path id="grid-5" d="M670 215 L670 575" fill="none" stroke="#d0cec8" stroke-width="3"/><text id="time-5" x="662" y="200" font-size="18" font-weight="400" fill="#3a3a3a">5</text><path id="grid-6" d="M756 215 L756 575" fill="none" stroke="#d0cec8" stroke-width="3"/><text id="time-6" x="748" y="200" font-size="18" font-weight="400" fill="#3a3a3a">6</text><path id="grid-7" d="M842 215 L842 575" fill="none" stroke="#d0cec8" stroke-width="3"/><text id="time-7" x="834" y="200" font-size="18" font-weight="400" fill="#3a3a3a">7</text><path id="grid-8" d="M928 215 L928 575" fill="none" stroke="#d0cec8" stroke-width="3"/><text id="time-8" x="920" y="200" font-size="18" font-weight="400" fill="#3a3a3a">8</text><path id="grid-9" d="M1014 215 L1014 575" fill="none" stroke="#d0cec8" stroke-width="3"/><text id="time-9" x="1006" y="200" font-size="18" font-weight="400" fill="#3a3a3a">9</text><path id="grid-10" d="M1100 215 L1100 575" fill="none" stroke="#d0cec8" stroke-width="3"/><text id="time-10" x="1092" y="200" font-size="18" font-weight="400" fill="#3a3a3a">10</text><text id="time-unit" x="240" y="600" font-size="19" font-weight="400" fill="#3a3a3a">時間位置（説明用）</text><path id="now-line" d="M584 215 L584 575" fill="none" stroke="#3a3a3a" stroke-width="3" stroke-dasharray="10 8"/><text id="now-label" x="552" y="244" font-size="20" font-weight="600" fill="#3a3a3a">現在</text><path id="deadline-line" d="M842 215 L842 575" fill="none" stroke="#c45c3a" stroke-width="3" stroke-dasharray="10 8"/><text id="deadline-label" x="850" y="244" font-size="22" font-weight="600" fill="#c45c3a">期限</text></g><g id="completed"><text id="completed-label" x="64" y="309" font-size="25" font-weight="600" fill="#3a3a3a">完了部分</text><rect id="completed-shape" x="240" y="280" width="344" height="42" rx="8" fill="#3a5a4a" opacity="1"/></g><g id="added"><text id="added-label" x="64" y="385" font-size="25" font-weight="600" fill="#3a3a3a">追加</text><rect id="added-shape" x="584" y="356" width="172" height="42" rx="8" fill="#8a5a4a" opacity="1"/></g><g id="remaining"><text id="remaining-label" x="64" y="461" font-size="25" font-weight="600" fill="#3a3a3a">残作業</text><rect id="remaining-shape" x="756" y="432" width="172" height="42" rx="8" fill="#4a5a6a" opacity="1"/></g><g id="downstream"><text id="downstream-label" x="64" y="537" font-size="25" font-weight="600" fill="#3a3a3a">後工程</text><rect id="downstream-shape" x="928" y="508" width="172" height="42" rx="8" fill="#4a5a6a" opacity="1"/></g></g><text id="footer" x="64" y="660" font-size