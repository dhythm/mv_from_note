<svg xmlns="http://www.w3.org/2000/svg" width="960" height="460" viewBox="0 0 960 460">
  <rect width="960" height="460" fill="#f7f6f3"/>
  <line x1="140" y1="48" x2="140" y2="420" stroke="#3a3a3a" stroke-width="2"/>
  <line x1="140" y1="48" x2="900" y2="48" stroke="#3a3a3a" stroke-width="2"/>
  <g fill="#6b6b6b" font-family="system-ui,sans-serif" font-size="14">
    <text x="170" y="36">8/1</text>
    <text x="290" y="36">8/8</text>
    <text x="410" y="36">8/15</text>
    <text x="530" y="36">8/22</text>
    <text x="650" y="36">8/29</text>
    <text x="770" y="36">9/5</text>
  </g>
  <g stroke="#d0cec8" stroke-width="1">
    <line x1="190" y1="48" x2="190" y2="420"/><line x1="310" y1="48" x2="310" y2="420"/>
    <line x1="430" y1="48" x2="430" y2="420"/><line x1="550" y1="48" x2="550" y2="420"/>
    <line x1="670" y1="48" x2="670" y2="420"/><line x1="790" y1="48" x2="790" y2="420"/>
  </g>
  <g fill="#3a3a3a" font-family="system-ui,sans-serif" font-size="16" text-anchor="end">
    <text x="128" y="102">追加</text>
    <text x="128" y="172">Task A</text>
    <text x="128" y="242">Task B</text>
    <text x="128" y="312">Task C</text>
    <text x="128" y="382">Task D</text>
  </g>
  <!-- added task -->
  <rect x="160" y="78" width="140" height="36" rx="4" fill="#8a5a4a" opacity="0.9"/>
  <!-- Task A: other bars stay (not blanket-shifted) -->
  <rect x="160" y="148" width="280" height="36" rx="4" fill="#5a6a7a" opacity="0.5"/>
  <!-- Task B: the in-progress one — 70% done portion solid, crack, 30% remainder cracked off -->
  <!-- 70% of 360 = 252 -->
  <rect x="200" y="218" width="252" height="36" rx="4" fill="#3a5a4a" opacity="0.95"/>
  <!-- crack gap -->
  <rect x="454" y="214" width="8" height="44" fill="#f7f6f3"/>
  <line x1="458" y1="210" x2="458" y2="262" stroke="#c45c3a" stroke-width="3" stroke-dasharray="4 3"/>
  <!-- cracked remainder floating up-right (30% = 108) -->
  <rect x="478" y="206" width="108" height="36" rx="4" fill="#7a8a6a" opacity="0.75" transform="rotate(-4 532 224)"/>
  <g fill="#c45c3a" font-family="system-ui,sans-serif" font-size="13" font-weight="700">
    <text x="220" y="242">〜7割</text>
    <text x="490" y="200">残り</text>
  </g>
  <!-- Task C, D unchanged (not blanket shift) -->
  <rect x="280" y="288" width="320" height="36" rx="4" fill="#5a6a7a" opacity="0.7"/>
  <rect x="340" y="358" width="300" height="36" rx="4" fill="#4a5a6a" opacity="0.7"/>
  <text x="200" y="440" fill="#6b6b6b" font-family="system-ui,sans-serif" font-size="12">※7割は演出上の割合（原稿「7割、8割」）。厳密な計測ではない</text>
</svg>
