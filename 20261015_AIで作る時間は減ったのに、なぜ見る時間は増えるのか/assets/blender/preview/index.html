<!doctype html><html lang="ja"><meta charset="utf-8"><title>Blender素材確認</title>
<style>body{background:#09111c;color:#e7eef5;font:16px system-ui;margin:32px auto;max-width:1100px}h1{font-size:24px}.stage{position:relative}.stage video{width:100%;display:block}.copy{position:absolute;left:6%;top:7%;font-size:clamp(22px,3.4vw,42px);font-weight:800;line-height:1.4;text-shadow:0 2px 8px #0008;pointer-events:none}.note{color:#a6bdce}button{padding:10px 16px;margin:8px 8px 18px 0;background:#173348;color:white;border:1px solid #426377;border-radius:6px}.anchor{position:absolute;transform:translate(-50%,-130%);background:#09111ce6;border:1px solid #80ddf6;padding:4px 7px;border-radius:4px;white-space:nowrap;font-size:clamp(10px,1.2vw,15px);pointer-events:none}#anchors{position:absolute;inset:0;pointer-events:none;overflow:hidden}</style>
<h1>制作速度と球持ち — Blender素材確認</h1>
<p class="note">文字は重ね合わせの確認用。本編のタイポグラフィは制作工程で実装。素材は無音・ロゴなし。</p>
<div><button onclick="show('07_before','これまでは、制作側が<br>ボールを持っていた。')">07 過去</button><button onclick="show('08_backlog','制作は速くなった。<br>見る速度は、変わらない。')">08 滞留</button><button onclick="show('13_quality_gates','指示と品質ゲートを、<br>先に整える。')">13 品質ゲート</button><button onclick="show('15_feedback_loop','判断を、次の作り方へ。')">15 改善</button></div>
<button onclick="video.play()">再生</button><button onclick="video.pause()">一時停止</button><button onclick="video.currentTime=0;video.play()">冒頭</button><button onclick="video.currentTime=video.duration/2;video.play()">中盤</button><button onclick="video.currentTime=Math.max(0,video.duration-3);video.play()">末尾3秒</button><p id="outside" hidden></p><div class="stage"><video id="video" controls loop playsinline src="../08_backlog.mp4"></video><div id="anchors"></div><div id="copy" class="copy">制作は速くなった。<br>見る速度は、変わらない。</div></div>
<p id="status" class="note">08_backlog 素材全尺／30fps</p>
<script>
window.video=document.querySelector('#video');let track=null;
fetch('../tracks/08_backlog.json').then(r=>r.json()).then(d=>{track=d});
const labels={'REVIEW / header':'レビュー','CHECK 1 / header':'テスト・VRT','CHECK 2 / header':'型・リンター','CHECK 3 / header':'規約・不要コード','SPECIFICATION board':'指示','SPECIFICATION':'指示を改善'};
async function show(name,copy){track=null;document.querySelector('#anchors').replaceChildren();video.src='../'+name+'.mp4';document.querySelector('#copy').innerHTML=copy;document.querySelector('#copy').hidden=['13_quality_gates','15_feedback_loop'].includes(name);const outside=document.querySelector('#outside');outside.hidden=!['13_quality_gates','15_feedback_loop'].includes(name);outside.textContent=copy.replaceAll('<br>',' ');document.querySelector('#status').textContent=name+' 素材全尺';video.play();const r=await fetch('../tracks/'+name+'.json');track=await r.json();}
function draw(){if(track){const row=track.frames[Math.min(track.frames.length-1,Math.floor(video.currentTime*30))];const root=document.querySelector('#anchors');root.replaceChildren();for(const [name,p] of Object.entries(row.anchors)){if(!p.visible)continue;const el=document.createElement('div');el.className='anchor';el.textContent=labels[name]||name;el.style.left=(100*p.x)+'%';el.style.top=(100*p.y)+'%';root.append(el);}}requestAnimationFrame(draw)}requestAnimationFrame(draw);
</script></html>
