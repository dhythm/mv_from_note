<!doctype html><html lang="ja"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>動画素材の確認 | AIと頭を使う場所</title><style>*{box-sizing:border-box}body{margin:0;background:#fbf8f1;color:#1e2430;font:16px/1.7 system-ui,sans-serif}main{max-width:1200px;margin:30px auto;padding:20px}h1{font-size:30px;margin:0 0 6px}p{margin:8px 0 20px}.tabs{display:flex;gap:12px;margin:20px 0}button,a.link{border:1px solid #d7d3cb;border-radius:12px;padding:10px 16px;background:white;font:inherit;color:inherit;cursor:pointer}button.active{background:#1e2430;color:white}video{width:100%;aspect-ratio:16/9;background:#e9e4dd;border-radius:18px;display:block}.meta{display:flex;justify-content:space-between;gap:20px;margin-top:16px}#caption{max-width:750px}a{color:#975000}small{color:#626977}.controls{margin:14px 0;display:flex;gap:12px}#time{font-variant-numeric:tabular-nums}</style><main><small>GROK BUILD · 2026.10.31 · 素材動画</small><h1>頭を使う場所が、移った。</h1><p>同じ机・ランプ・床を使う3本。キネティックタイポグラフィに組み込むための、文字なしの素材です。</p><div class="tabs"><button onclick="pick(0)" id="b0">04｜未経験へ</button><button onclick="pick(1)" id="b1">07｜爆速</button><button onclick="pick(2)" id="b2">10｜広がる床</button></div><video id="v" controls playsinline preload="metadata"></video><div class="controls"><button onclick="v.currentTime=0;v.play()">最初から等速再生</button><button onclick="v.pause();v.currentTime=Number(v.duration)-0.1">最後のコマ</button><span id="time"></span></div><div class="meta"><div><b id="title"></b><p id="caption"></p><small>1280×720 · 24fps · AI生成のイメージ映像。筆者の記録映像ではありません。</small></div><a id="download" download>MP4を保存</a></div><p><a href="plan.html">企画書へ</a></p></main><script>const clips=[{s:'cut04-lamp-floor-tiles',t:'04｜未経験の領域',d:'机の外へ床が順に明るくなる。円の窓で切り抜き、5つの仕事の文字と重ねる。'},{s:'cut07-tiles-rush',t:'07｜爆速と不安',d:'床すれすれの前進。「爆速」の字形に切り抜いて使う。'},{s:'cut10-lit-floor-crane',t:'10｜明るくなった床の広がり',d:'机から滑らかに上昇し、明るい床の広がりを見下ろす。結論の文字は白い札で重ねる。'}];const v=document.querySelector('#v');function pick(i){v.pause();const c=clips[i];v.src='assets/footage/'+c.s+'.mp4';document.querySelector('#download').href=v.src;document.querySelector('#title').textContent=c.t;document.querySelector('#caption').textContent=c.d;document.querySelectorAll('.tabs button').forEach((b,n)=>b.classList.toggle('active',n===i));}v.ontimeupdate=()=>document.querySelector('#time').textContent=v.currentTime.toFixed(1)+' / '+(v.duration||0).toFixed(1)+' 秒';pick(0);</script></html>
