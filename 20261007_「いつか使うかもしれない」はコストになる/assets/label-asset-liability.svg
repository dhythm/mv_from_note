<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="640" height="360" viewBox="0 0 640 360">
  <!-- dual-sided concept: 資産 and 負債 both visible (flip without erasing asset) -->
  <!-- left face: 資産 -->
  <g>
    <rect x="48" y="60" width="240" height="240" rx="8" fill="rgba(58,58,58,0.12)" stroke="#3a3a3a" stroke-width="2.5"/>
    <text x="168" y="195" text-anchor="middle" font-family="system-ui,sans-serif" font-size="56" font-weight="700" fill="#3a3a3a">資産</text>
    <text x="168" y="270" text-anchor="middle" font-family="system-ui,sans-serif" font-size="14" fill="#3a3a3a" opacity="0.55">ASSET</text>
  </g>
  <!-- hinge / flip axis -->
  <line x1="320" y1="50" x2="320" y2="310" stroke="#3a3a3a" stroke-width="2" stroke-dasharray="6 6" opacity="0.5"/>
  <!-- right face: 負債 (shown as reverse / other side) -->
  <g>
    <rect x="352" y="60" width="240" height="240" rx="8" fill="rgba(58,58,58,0.22)" stroke="#3a3a3a" stroke-width="2.5"/>
    <text x="472" y="195" text-anchor="middle" font-family="system-ui,sans-serif" font-size="56" font-weight="700" fill="#3a3a3a">負債</text>
    <text x="472" y="270" text-anchor="middle" font-family="system-ui,sans-serif" font-size="14" fill="#3a3a3a" opacity="0.55">LIABILITY</text>
  </g>
  <!-- small perspective hint: edge of flipped card under right -->
  <polygon points="352,60 340,72 340,288 352,300" fill="rgba(58,58,58,0.06)" stroke="#3a3a3a" stroke-width="1.5" opacity="0.8"/>
</svg>
