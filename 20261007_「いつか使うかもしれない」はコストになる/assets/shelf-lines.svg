<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720">
  <!-- optional simple shelf lines; transparent bg -->
  <g fill="none" stroke="#3a3a3a" stroke-width="2" stroke-linecap="square">
    <!-- three shelf boards -->
    <line x1="160" y1="220" x2="1120" y2="220"/>
    <line x1="160" y1="400" x2="1120" y2="400"/>
    <line x1="160" y1="580" x2="1120" y2="580"/>
    <!-- uprights -->
    <line x1="180" y1="140" x2="180" y2="600"/>
    <line x1="1100" y1="140" x2="1100" y2="600"/>
    <!-- subtle shelf thickness -->
    <line x1="160" y1="228" x2="1120" y2="228" opacity="0.35"/>
    <line x1="160" y1="408" x2="1120" y2="408" opacity="0.35"/>
    <line x1="160" y1="588" x2="1120" y2="588" opacity="0.35"/>
  </g>
  <!-- empty book-slot marks (no text) -->
  <g fill="none" stroke="#3a3a3a" stroke-width="1.5" opacity="0.4">
    <rect x="220" y="150" width="18" height="68" rx="1"/>
    <rect x="250" y="155" width="14" height="63" rx="1"/>
    <rect x="275" y="148" width="20" height="70" rx="1"/>
    <rect x="310" y="152" width="16" height="66" rx="1"/>
    <rect x="340" y="158" width="12" height="60" rx="1"/>
    <rect x="220" y="330" width="16" height="68" rx="1"/>
    <rect x="248" y="325" width="20" height="73" rx="1"/>
    <rect x="280" y="335" width="14" height="63" rx="1"/>
    <rect x="220" y="510" width="18" height="68" rx="1"/>
    <rect x="250" y="515" width="15" height="63" rx="1"/>
    <rect x="278" y="508" width="22" height="70" rx="1"/>
  </g>
</svg>
