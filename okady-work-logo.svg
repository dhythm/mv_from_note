<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg width="1250" height="400" viewBox="0 0 1250 400" version="1.1" xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink">
  <style>
    /* 0–2.6s : o が右上から落ちて2回バウンドし、転がって定位置へ。kady は o の通過後に現れる
       2.6–3.2s: okady 全体が左へスライドし、最終レイアウトの位置へ
       3.0–4.0s: 後ろに「.work」が一文字ずつ浮かび上がる */
    .ox, .reveal { animation: ox 2.6s both; }
    .oy { animation: oy 2.6s both; }
    .squash { transform-box: view-box; transform-origin: 326.59px 263.04px; animation: squash 2.6s both; }
    .spin { transform-box: view-box; transform-origin: 326.59px 218.5px; animation: spin 2.6s both; }
    .slide { animation: slide .6s 2.6s cubic-bezier(.7,0,.2,1) both; }
    .w { opacity: 0; transform-box: fill-box; transform-origin: 50% 100%;
         animation: rise .7s cubic-bezier(.2,.7,.3,1) both; }
    .w0 { animation-delay: 3.0s; }
    .w1 { animation-delay: 3.08s; }
    .w2 { animation-delay: 3.16s; }
    .w3 { animation-delay: 3.24s; }
    .w4 { animation-delay: 3.32s; }
    @keyframes ox {
      0%   { transform: translateX(620px); animation-timing-function: linear; }
      62%  { transform: translateX(240px); animation-timing-function: cubic-bezier(.2,.6,.35,1); }
      88%  { transform: translateX(-8px);  animation-timing-function: ease-in-out; }
      100% { transform: translateX(0); }
    }
    @keyframes spin {
      0%   { transform: rotate(-798deg); animation-timing-function: linear; }
      62%  { transform: rotate(-309deg); animation-timing-function: cubic-bezier(.2,.6,.35,1); }
      88%  { transform: rotate(10deg);   animation-timing-function: ease-in-out; }
      100% { transform: rotate(0); }
    }
    @keyframes oy {
      0%   { transform: translateY(-260px); animation-timing-function: cubic-bezier(.55,0,1,.45); }
      22%  { transform: translateY(0);      animation-timing-function: cubic-bezier(0,.55,.45,1); }
      34%  { transform: translateY(-70px);  animation-timing-function: cubic-bezier(.55,0,1,.45); }
      46%  { transform: translateY(0);      animation-timing-function: cubic-bezier(0,.55,.45,1); }
      54%  { transform: translateY(-22px);  animation-timing-function: cubic-bezier(.55,0,1,.45); }
      62%, 100% { transform: translateY(0); }
    }
    @keyframes squash {
      0%, 20%   { transform: scale(1, 1); }
      22%       { transform: scale(1.16, .84); }
      27%       { transform: scale(.95, 1.05); }
      31%, 44%  { transform: scale(1, 1); }
      46%       { transform: scale(1.1, .9); }
      50%, 60%  { transform: scale(1, 1); }
      62%       { transform: scale(1.05, .95); }
      66%, 87%  { transform: scale(1, 1); }
      90%       { transform: scale(1.04, .96); }
      95%, 100% { transform: scale(1, 1); }
    }
    /* okady 単体時は中央（中心 x=431 → 625）、.work 出現前に最終位置へ */
    @keyframes slide {
      from { transform: translateX(194px); }
      to   { transform: translateX(0); }
    }
    @keyframes rise {
      from { opacity: 0; transform: translateY(18px); }
      to   { opacity: 1; transform: translateY(0); }
    }
    @media (prefers-reduced-motion: reduce) {
      .ox, .oy, .squash, .spin, .reveal, .slide, .w { animation: none; opacity: 1; }
    }
  </style>
  <defs>
    <!-- o の右端（x≈371）に追従して kady を表示するクリップ -->
    <clipPath id="kady-reveal">
      <rect class="reveal" x="371" y="0" width="600" height="400" />
    </clipPath>
    <!-- 書体を合わせるため、元ロゴの o / k グリフを再利用 -->
    <path id="glyph-o" d="m 326.84001,263.04 q -12.92,0 -23.12,-5.61 -10.03,-5.78 -15.81,-15.81 -5.61,-10.03 -5.61,-23.12 0,-13.09 5.61,-23.12 5.61,-10.03 15.64,-15.64 10.03,-5.78 22.95,-5.78 13.09,0 23.12,5.78 10.03,5.61 15.64,15.64 5.61,10.03 5.61,23.12 0,13.09 -5.61,23.12 -5.61,10.03 -15.64,15.81 -9.86,5.61 -22.78,5.61 z m 0,-20.74 q 6.29,0 11.05,-3.06 4.76,-3.06 7.31,-8.33 2.72,-5.44 2.72,-12.41 0,-6.97 -2.72,-12.24 -2.72,-5.44 -7.65,-8.5 -4.76,-3.06 -11.05,-3.06 -6.12,0 -11.05,3.06 -4.76,3.06 -7.48,8.5 -2.72,5.27 -2.72,12.24 0,6.97 2.72,12.41 2.72,5.27 7.65,8.33 4.93,3.06 11.22,3.06 z" />
    <path id="glyph-k" d="M 385.66,261 V 142 h 22.44 v 65.62 l 29.07,-31.62 h 26.69 l -32.13,35.87 34.68,49.13 h -26.35 l -22.61,-32.98 -9.35,10.2 V 261 Z" />
  </defs>
  <path id="bg" style="fill:#d2ff1a" d="M 0,0 H 1250 V 400 H 0 Z" />

  <g class="slide">
    <g
       id="mark"
       transform="translate(110,127.64) scale(0.67)">
      <g
         fill="none"
         stroke="#0A0A0A"
         stroke-width="22"
         stroke-linecap="round"
         stroke-linejoin="round"
         id="g2">
        <path
           d="M11,95 A84,84 0 0 1 179,95 V193 Q179,205 167,205 H23 Q11,205 11,193 Z"
           id="path1" />
        <path
           d="M11,95 H179 M95,95 V205 M11,150 H179"
           id="path2" />
      </g>
    </g>
    <g id="t0" fill="#0a0a0a" aria-label="okady">
      <path id="kady" clip-path="url(#kady-reveal)" d="M 385.66001,261 V 142 h 22.44 v 65.62 l 29.07,-31.62 h 26.69 l -32.13,35.87 34.68,49.13 h -26.35 l -22.61,-32.98 -9.35,10.2 V 261 Z m 114.58018,2.04 q -15.3,0 -23.8,-6.8 -8.33,-6.8 -8.33,-19.21 0,-13.6 9.01,-20.4 9.18,-6.97 25.67,-6.97 h 20.06 q -1.19,-7.82 -4.93,-11.9 -3.74,-4.25 -10.71,-4.25 -5.44,0 -9.86,2.38 -4.42,2.38 -7.48,7.31 l -19.72,-6.8 q 2.38,-5.44 6.97,-10.54 4.59,-5.27 11.9,-8.5 7.48,-3.4 18.19,-3.4 12.92,0 21.42,4.93 8.67,4.93 12.75,13.94 4.25,8.84 4.08,21.08 l -0.51,47.09 h -20.91 l -0.34,-9.86 q -3.23,5.78 -9.18,8.84 -5.78,3.06 -14.28,3.06 z m 3.74,-18.7 q 5.44,0 9.86,-2.55 4.42,-2.55 6.97,-6.63 2.55,-4.08 2.55,-8.5 v -0.34 h -12.75 q -11.05,0 -15.3,2.72 -4.25,2.55 -4.25,7.31 0,3.74 3.4,5.95 3.4,2.04 9.52,2.04 z m 93.16015,18.7 q -11.73,0 -20.4,-5.44 -8.5,-5.44 -13.26,-15.47 -4.76,-10.03 -4.76,-23.63 0,-13.77 4.76,-23.63 4.76,-10.03 13.26,-15.47 8.67,-5.44 20.4,-5.44 8.33,0 14.79,3.57 6.63,3.4 10.71,9.86 V 142 h 22.44 v 119 h -21.25 l -0.68,-11.9 q -4.25,6.63 -10.88,10.37 -6.63,3.57 -15.13,3.57 z m 5.78,-20.57 q 5.61,0 9.86,-2.72 4.42,-2.89 6.97,-7.99 2.55,-5.1 2.89,-11.56 v -3.4 q -0.34,-6.46 -2.89,-11.39 -2.55,-5.1 -6.97,-7.82 -4.42,-2.89 -10.03,-2.89 -6.12,0 -10.88,3.06 -4.59,2.89 -7.31,8.33 -2.55,5.44 -2.55,12.41 0,6.97 2.72,12.41 2.72,5.44 7.31,8.5 4.76,3.06 10.88,3.06 z m 78.5399,54.57 q -4.59,0 -10.2,-1.87 -5.44,-1.7 -9.69,-4.08 l 8.33,-18.19 q 2.89,1.53 5.27,2.38 2.55,1.02 4.42,1.02 3.57,0 6.29,-2.04 2.72,-1.87 4.42,-5.61 l 3.57,-8.67 -38.42,-83.98 h 24.65 l 24.14,58.65 23.12,-58.65 h 24.65 l -38.59,92.31 q -3.57,8.5 -7.48,14.96 -3.91,6.63 -9.69,10.2 -5.61,3.57 -14.79,3.57 z" />
      <g class="ox"><g class="oy"><g class="squash"><g class="spin">
        <path id="o" d="m 326.84001,263.04 q -12.92,0 -23.12,-5.61 -10.03,-5.78 -15.81,-15.81 -5.61,-10.03 -5.61,-23.12 0,-13.09 5.61,-23.12 5.61,-10.03 15.64,-15.64 10.03,-5.78 22.95,-5.78 13.09,0 23.12,5.78 10.03,5.61 15.64,15.64 5.61,10.03 5.61,23.12 0,13.09 -5.61,23.12 -5.61,10.03 -15.64,15.81 -9.86,5.61 -22.78,5.61 z m 0,-20.74 q 6.29,0 11.05,-3.06 4.76,-3.06 7.31,-8.33 2.72,-5.44 2.72,-12.41 0,-6.97 -2.72,-12.24 -2.72,-5.44 -7.65,-8.5 -4.76,-3.06 -11.05,-3.06 -6.12,0 -11.05,3.06 -4.76,3.06 -7.48,8.5 -2.72,5.27 -2.72,12.24 0,6.97 2.72,12.41 2.72,5.27 7.65,8.33 4.93,3.06 11.22,3.06 z" />
      </g></g></g></g>
    </g>

    <!-- .work（同じ書体のメトリクス：ベースライン 261 / x ハイト 176 / ステム 22.44） -->
    <g id="work" fill="#0a0a0a" aria-label=".work">
      <!-- . -->
      <circle class="w w0" cx="744" cy="248" r="13" />
      <!-- w：4本の斜線（水平幅 23.5 / 傾き 27px） -->
      <path class="w w1" d="M 766,176 H 789.5 L 816.5,261 H 793 Z M 820,176 H 843.5 L 816.5,261 H 793 Z M 820,176 H 843.5 L 870.5,261 H 847 Z M 874,176 H 897.5 L 870.5,261 H 847 Z" />
      <!-- o -->
      <g class="w w2"><use xlink:href="#glyph-o" href="#glyph-o" transform="translate(616.4 0)" /></g>
      <!-- r：ステム + 肩（d の接合部の切り欠きに合わせた形） -->
      <path class="w w3" d="M 999.5,261 V 176 H 1020.75 L 1021.4,188 Q 1025,181 1030.5,177.5 Q 1037,173.96 1045.5,173.96 Q 1049.5,173.96 1053,174.8 V 196.5 Q 1049,195.4 1044.5,195.4 Q 1034,195.4 1028,201.5 Q 1021.94,207.6 1021.94,219 V 261 Z" />
      <!-- k -->
      <g class="w w4"><use xlink:href="#glyph-k" href="#glyph-k" transform="translate(673.34 0)" /></g>
    </g>
  </g>
</svg>
